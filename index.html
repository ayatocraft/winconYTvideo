<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wincon TubeView</title>
<style>
:root{--bg:#0f0f0f;--sf:#272727;--hv:#3f3f3f;--tx:#f1f1f1;--tx2:#aaa;--ln:#3f3f3f;--ac:#3ea6ff;--red:#f00}
@media(prefers-color-scheme:light){:root{--bg:#fff;--sf:#f2f2f2;--hv:#e5e5e5;--tx:#0f0f0f;--tx2:#606060;--ln:#e5e5e5;--ac:#065fd4}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Roboto,Arial,"Hiragino Sans","Yu Gothic",sans-serif}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
header{position:fixed;inset:0 0 auto 0;height:56px;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--bg);z-index:10}
.logo{display:flex;align-items:center;gap:4px;font-weight:700;font-size:18px;letter-spacing:-.5px}
.logo i{width:30px;height:21px;background:var(--red);border-radius:6px;display:grid;place-items:center}
.logo i:after{content:"";border:5px solid transparent;border-left:8px solid #fff;border-right:0}
form{display:flex;flex:0 1 640px;min-width:0;margin:0 auto}
#q{flex:1;min-width:0;height:40px;padding:0 16px;border:1px solid var(--ln);border-radius:20px 0 0 20px;background:var(--bg);outline:0}
#q:focus{border-color:var(--ac)}
form button{width:64px;height:40px;border:1px solid var(--ln);border-left:0;border-radius:0 20px 20px 0;background:var(--sf)}
.ib{width:40px;height:40px;border:0;border-radius:50%;background:none;font-size:18px}
.ib:hover{background:var(--sf)}
.rail{position:fixed;top:56px;bottom:0;left:0;width:72px;display:flex;flex-direction:column;padding:4px;z-index:5}
.rail a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0 14px;border-radius:10px;font-size:10px}
.rail a:hover{background:var(--sf)}
.rail a.on{background:var(--sf)}
.rail svg{width:24px;height:24px;fill:currentColor}
#main{margin:56px 0 0 72px;padding:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:32px 16px}
.cw{position:relative}
.th{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--sf)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:500;padding:1px 4px;border-radius:4px}
.dur:empty{display:none}
.mt{display:flex;gap:12px;margin-top:12px}
.av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--hv);display:grid;place-items:center;font-weight:600;object-fit:cover}
h3{margin:0 0 4px;font-size:16px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mt p,.s{margin:0;color:var(--tx2);font-size:12.5px}
.rm{position:absolute;top:8px;right:8px;width:28px;height:28px;border:0;border-radius:50%;background:rgba(0,0,0,.7);color:#fff}
.btn{display:block;margin:24px auto;padding:8px 20px;border:1px solid var(--ln);border-radius:18px;background:var(--sf)}
.btn:hover{background:var(--hv)}
.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac);display:inline-block;margin:0}
.msg{max-width:560px;margin:48px auto;padding:16px;border-radius:12px;background:var(--sf);text-align:center;color:var(--tx2);white-space:pre-wrap}
.pt{margin:0 0 20px;font-size:20px}
.watch{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;max-width:1700px;margin:auto}
.player{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.player iframe{width:100%;height:100%;border:0;display:block}
h1{margin:12px 0;font-size:20px;line-height:1.4}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.ch{display:flex;align-items:center;gap:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:0 16px;height:36px;display:inline-flex;align-items:center;border:0;border-radius:18px;background:var(--sf)}
button.pill:hover,a.pill:hover{background:var(--hv)}
.desc{margin-top:12px;padding:12px;border-radius:12px;background:var(--sf);cursor:pointer}
.dt{margin-top:4px;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.desc.open .dt{display:block}
.chd{display:flex;align-items:center;gap:16px;margin:24px 0 16px}
.chd h2{margin:0;font-size:20px}
select{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:4px 8px}
.c{display:flex;gap:16px;margin-bottom:20px}
.c .av{width:40px;height:40px}
.ct{white-space:pre-wrap;word-break:break-word;margin:2px 0 4px}
.rp{margin-top:8px}
.lnk{border:0;background:none;color:var(--ac);padding:4px 0;font-weight:500}
aside h4{margin:0 0 12px}
.mini{display:flex;gap:8px;margin-bottom:12px}
.mini img{width:168px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;flex:none}
.mini b{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini p{margin:2px 0 0;font-size:12px;color:var(--tx2)}
dialog{max-width:440px;border:0;border-radius:16px;background:var(--bg);color:var(--tx);padding:24px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 8px}
dialog p{color:var(--tx2);margin:0 0 16px}
dialog input{width:100%;height:40px;padding:0 12px;border:1px solid var(--ln);border-radius:8px;background:var(--sf)}
.dr{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.dr .btn{margin:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media(max-width:1000px){.watch{grid-template-columns:1fr}}
@media(max-width:700px){
.rail{top:auto;height:56px;width:100%;flex-direction:row;justify-content:space-around;background:var(--bg);padding:0}
.rail a{padding:8px 24px;gap:2px}
#main{margin:56px 0 56px;padding:12px}
.logo span{display:none}
}
</style>
</head>
<body>
<header>
  <a class="logo" href="#/"><i></i><span>TubeView</span></a>
  <form id="sf"><input id="q" type="search" placeholder="検索" autocomplete="off"><button aria-label="検索">🔍</button></form>
</header>
<nav class="rail">
  <a href="#/" data-v="home"><svg viewBox="0 0 24 24"><path d="M12 4.33l7 6.12V20h-4v-6H9v6H5v-9.55l7-6.12M12 3L4 10v11h6v-6h4v6h6V10z"/></svg>ホーム</a>
  <a href="#/saved" data-v="saved"><svg viewBox="0 0 24 24"><path d="M17 3H7a2 2 0 0 0-2 2v16l7-3 7 3V5a2 2 0 0 0-2-2z"/></svg>保存済み</a>
</nav>
<main id="main"></main>
<script>
const $=s=>document.querySelector(s), main=$('#main');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
/* ★ ここにYouTube Data API v3のAPIキーを埋め込んでください ★ */
const API_KEY='AIzaSyDdhWHSgAxCR2HZ2dtryS-w63Gz_tQjnA4';
const key=API_KEY.startsWith('AIza')?API_KEY:'';
let saved=LS('tv_saved',[]);
const VP='snippet,contentDetails,statistics';

/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>{n=+n;if(isNaN(n))return'—';return n>=1e8?(n/1e8).toFixed(1)+'億':n>=1e4?(n/1e4).toFixed(n>=1e5?0:1)+'万':n.toLocaleString()};
const ago=d=>{const s=(Date.now()-new Date(d))/1e3;for(const[a,b]of[[31536000,'年'],[2592000,'か月'],[604800,'週間'],[86400,'日'],[3600,'時間'],[60,'分']])if(s>=a)return Math.floor(s/a)+b+'前';return'たった今'};
const dur=iso=>{const m=/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(iso||'');if(!m)return'';const h=+m[1]||0,mi=+m[2]||0,s=+m[3]||0,p=n=>String(n).padStart(2,'0');return h?`${h}:${p(mi)}:${p(s)}`:`${mi}:${p(s)}`};
const thumb=v=>v.snippet.thumbnails?.medium?.url||`https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`;
const isSaved=id=>saved.some(v=>v.id===id);
const slim=v=>({id:v.id,snippet:{title:v.snippet.title,channelTitle:v.snippet.channelTitle,channelId:v.snippet.channelId,publishedAt:v.snippet.publishedAt,thumbnails:{medium:v.snippet.thumbnails?.medium}},contentDetails:{duration:v.contentDetails?.duration},statistics:{viewCount:v.statistics?.viewCount}});
const toggle=v=>{saved=isSaved(v.id)?saved.filter(x=>x.id!==v.id):[slim(v),...saved];SV('tv_saved',saved)};
const msg=t=>`<div class="msg">${esc(t)}</div>`;

/* ---------- API ---------- */
async function api(ep,p){
  if(!key)throw new Error('APIキーが未設定です。\ntubeview.html の API_KEY にキー（AIza...）を埋め込んでください。')
  const u=new URL('https://www.googleapis.com/youtube/v3/'+ep);
  Object.entries({...p,key}).forEach(([k,v])=>v!==''&&v!=null&&u.searchParams.set(k,v));
  const r=await fetch(u),j=await r.json();
  if(!r.ok)throw new Error(j.error?.message||'HTTP '+r.status);
  return j;
}
const home=async t=>{const r=await api('videos',{part:VP,chart:'mostPopular',regionCode:'JP',maxResults:24,pageToken:t});return{items:r.items,next:r.nextPageToken}};
const search=q=>async t=>{
  const s=await api('search',{part:'snippet',type:'video',q,maxResults:24,pageToken:t});
  const ids=s.items.map(i=>i.id.videoId).join(',');
  const r=ids?await api('videos',{part:VP,id:ids}):{items:[]};
  return{items:r.items,next:s.nextPageToken};
};

/* ---------- views ---------- */
const card=(v,rm)=>`<div class="cw"><a href="#/watch/${v.id}"><div class="th"><img loading="lazy" src="${esc(thumb(v))}" alt=""><span class="dur">${dur(v.contentDetails?.duration)}</span></div><div class="mt"><div class="av">${esc(v.snippet.channelTitle[0])}</div><div><h3>${esc(v.snippet.title)}</h3><p>${esc(v.snippet.channelTitle)}</p><p>${v.statistics?.viewCount?num(v.statistics.viewCount)+'回視聴・':''}${ago(v.snippet.publishedAt)}</p></div></div></a>${rm?`<button class="rm" data-id="${v.id}" title="保存を解除">✕</button>`:''}</div>`;

function loadList(fetcher){
  main.innerHTML='<div class="grid" id="g"></div><div id="more"></div>';
  let token='';
  const run=async()=>{
    $('#more').innerHTML='<div class="s" style="text-align:center">読み込み中…</div>';
    try{
      const{items,next}=await fetcher(token);
      $('#g').insertAdjacentHTML('beforeend',items.map(v=>card(v)).join(''));
      token=next;
      $('#more').innerHTML=next?'<button class="btn" id="mb">もっと見る</button>':'';
      if(next)$('#mb').onclick=run;
      if(!$('#g').children.length)$('#more').innerHTML=msg('動画が見つかりませんでした。別のキーワードで検索してください。');
    }catch(e){$('#more').innerHTML=msg(e.message)}
  };
  run();
}

function savedView(){
  main.innerHTML=saved.length
    ?`<h2 class="pt">保存した動画（${saved.length}）</h2><div class="grid">${saved.map(v=>card(v,1)).join('')}</div>`
    :msg('保存した動画はまだありません。動画ページの「保存」から追加できます。');
}

const cmt=t=>{const c=t.snippet.topLevelComment.snippet,n=t.snippet.totalReplyCount;
  return`<div class="c"><img class="av" src="${esc(c.authorProfileImageUrl)}" alt=""><div><b>${esc(c.authorDisplayName)}</b> <span class="s">${ago(c.publishedAt)}</span><div class="ct">${esc(c.textDisplay)}</div><div class="s">👍 ${num(c.likeCount)}</div>${n?`<button class="lnk" data-p="${t.id}">▼ 返信${n}件</button><div class="rp"></div>`:''}</div></div>`};

async function loadComments(id,order,token=''){
  if(!token){
    $('#cm').innerHTML='<div class="chd"><h2>コメント</h2><select id="od"><option value="relevance">評価順</option><option value="time">新しい順</option></select></div><div id="cl"></div><div id="cmore"></div>';
    $('#od').value=order;
    $('#od').onchange=e=>loadComments(id,e.target.value);
  }
  try{
    const r=await api('commentThreads',{part:'snippet',videoId:id,maxResults:20,order,textFormat:'plainText',pageToken:token});
    $('#cl').insertAdjacentHTML('beforeend',r.items.map(cmt).join('')||(token?'':msg('コメントはありません')));
    $('#cmore').innerHTML=r.nextPageToken?'<button class="btn" id="cb">もっと見る</button>':'';
    if(r.nextPageToken)$('#cb').onclick=()=>loadComments(id,order,r.nextPageToken);
  }catch(e){$('#cl').innerHTML=msg('コメントを取得できません: '+e.message)}
}

function renderInfo(v){
  const s=v.snippet,st=v.statistics||{};
  $('#info').innerHTML=`<h1>${esc(s.title)}</h1><div class="row"><div class="ch"><div class="av">${esc(s.channelTitle[0])}</div><b>${esc(s.channelTitle)}</b></div><div class="acts"><span class="pill">👍 ${st.likeCount!=null?num(st.likeCount):'—'}</span><button class="pill" id="sv"></button><a class="pill" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${v.id}">YouTubeで開く</a></div></div><div class="desc" id="ds"><b>${num(st.viewCount)}回視聴　${ago(s.publishedAt)}</b><div class="dt">${esc(s.description)}</div></div>`;
  const b=$('#sv'),upd=()=>b.textContent=isSaved(v.id)?'✓ 保存済み':'＋ 保存';
  upd();
  b.onclick=()=>{toggle(v);upd();renderSide()};
  $('#ds').onclick=e=>e.currentTarget.classList.toggle('open');
}
function renderSide(){
  $('#side').innerHTML=saved.length?'<h4>保存した動画</h4>'+saved.slice(0,10).map(v=>`<a class="mini" href="#/watch/${v.id}"><img src="${esc(thumb(v))}" alt=""><div><b>${esc(v.snippet.title)}</b><p>${esc(v.snippet.channelTitle)}</p></div></a>`).join(''):'';
}

async function watch(id){
  main.innerHTML='<div class="watch"><div><div class="player"><iframe id="pl" title="動画プレーヤー" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div id="info"></div><div id="cm"></div></div><aside id="side"></aside></div>';
  $('#pl').src=`https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0`+(location.protocol.startsWith('http')?'&origin='+encodeURIComponent(location.origin):'');
  renderSide();
  if(location.protocol==='file:')$('#info').innerHTML=msg('file:// で開いているため、YouTubeの埋め込みが拒否されることがあります（エラー153）。\nローカルサーバー（例: python3 -m http.server）経由で開いてください。');
  try{
    const r=await api('videos',{part:VP,id}),v=r.items[0];
    if(!v)throw new Error('動画が見つかりません');
    document.title=v.snippet.title+' - TubeView';
    const note=location.protocol==='file:'?$('#info').innerHTML:'';
    renderInfo(v);
    $('#info').insertAdjacentHTML('afterbegin',note);
  }catch(e){$('#info').innerHTML=msg(e.message)}
  loadComments(id,'relevance');
}

/* ---------- router ---------- */
function route(){
  const[v='home',a='']=location.hash.slice(2).split('/').map(decodeURIComponent);
  document.title='TubeView';
  document.querySelectorAll('.rail a').forEach(x=>x.classList.toggle('on',x.dataset.v===(v||'home')));
  if(v==='search')$('#q').value=a;
  if(v==='watch')return watch(a);
  if(v==='search')return loadList(search(a));
  if(v==='saved')return savedView();
  loadList(home);
}
addEventListener('hashchange',route);

/* ---------- events ---------- */
$('#sf').onsubmit=e=>{e.preventDefault();const q=$('#q').value.trim();if(q)location.hash='#/search/'+encodeURIComponent(q)};
document.addEventListener('click',async e=>{
  const rm=e.target.closest('.rm');
  if(rm){e.preventDefault();saved=saved.filter(v=>v.id!==rm.dataset.id);SV('tv_saved',saved);savedView();return}
  const b=e.target.closest('[data-p]');
  if(!b)return;
  const box=b.nextElementSibling;
  if(box.innerHTML){box.innerHTML='';return}
  box.textContent='読み込み中…';
  try{
    const r=await api('comments',{part:'snippet',parentId:b.dataset.p,maxResults:50,textFormat:'plainText'});
    box.innerHTML=r.items.map(i=>cmt({id:i.id,snippet:{topLevelComment:i,totalReplyCount:0}})).join('');
  }catch(x){box.textContent=x.message}
});

route();
</script>
</body>
</html>
